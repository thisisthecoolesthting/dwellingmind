<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DwellingMind Product Demo</title><meta name="description" content="Interactive DwellingMind home operating system prototype."><link rel="icon" href="/assets/icon.svg"><link rel="stylesheet" href="/app/app.css"><script defer src="/app/app.js"></script></head><body><div class="shell"><aside class="sidebar"><a href="/"><img src="/assets/logo.svg" alt="DwellingMind"></a><button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button><button class="nav-item" data-view="equipment">⚙ <span>Equipment</span></button><button class="nav-item" data-view="maintenance">✓ <span>Maintenance</span></button><button class="nav-item" data-view="documents">▤ <span>Documents</span></button><button class="nav-item" data-view="timeline">◷ <span>Timeline</span></button><button class="nav-item" data-view="ask">✦ <span>Ask DwellingMind</span></button><div class="sidebar-foot"><button id="export-btn">Export data</button><button id="reset-btn">Reset demo</button><a href="/">← Website</a></div></aside><main class="main"><header class="topbar"><div><small>DEMO HOME</small><h1>Welcome home.</h1></div><div class="top-actions"><button id="add-btn" class="primary">+ Add record</button><div class="avatar">RR</div></div></header><section id="view"></section></main></div><dialog id="modal"><form method="dialog" id="record-form"><div class="modal-head"><h2>Add a home record</h2><button value="cancel">×</button></div><label>Record type<select name="type"><option value="equipment">Equipment</option><option value="maintenance">Maintenance task</option><option value="document">Document</option><option value="timeline">Timeline event</option></select></label><label>Name<input name="name" required placeholder="e.g. Main HVAC system"></label><label>Details<textarea name="details" placeholder="Model, due date, location, notes..."></textarea></label><div class="modal-actions"><button value="cancel">Cancel</button><button class="primary" value="default">Save record</button></div></form></dialog><div id="toast"></div></body></html>
